<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Verificación y Pruebas del Motor Financiero</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../frontend/js/financial-engine.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 p-6 font-sans">
  <div class="max-w-2xl mx-auto space-y-6">
    <div class="border-b border-slate-800 pb-4">
      <h1 class="text-2xl font-black text-sky-400">🧪 Batería de Pruebas Financieras</h1>
      <p class="text-sm text-slate-400">Verificación de Reglas Contables, Ciclos de Tarjetas de Crédito y Prepagos</p>
    </div>

    <div id="test-results" class="space-y-3">
      <!-- Resultados dinámicos -->
    </div>

    <div id="summary-box" class="p-4 rounded-2xl bg-slate-900 border border-slate-800">
      <p class="text-sm font-semibold text-slate-300">Ejecutando pruebas...</p>
    </div>
  </div>

  <script>
    const resultsContainer = document.getElementById('test-results');
    const summaryBox = document.getElementById('summary-box');
    let passedCount = 0;
    let failedCount = 0;

    function report(name, passed, details) {
      if (passed) passedCount++;
      else failedCount++;

      const div = document.createElement('div');
      div.className = `p-3.5 rounded-xl border flex items-start gap-3 text-xs ${
        passed ? 'bg-emerald-950/40 border-emerald-500/30 text-emerald-200' : 'bg-rose-950/40 border-rose-500/30 text-rose-200'
      }`;
      div.innerHTML = `
        <span class="text-base">${passed ? '✅' : '❌'}</span>
        <div>
          <strong class="text-sm block text-white">${name}</strong>
          <span class="opacity-80">${details}</span>
        </div>
      `;
      resultsContainer.appendChild(div);
    }

    const { 
      TIPOS_TRANSACCION, 
      CATEGORIAS_GASTO, 
      CATEGORIAS_INGRESO, 
      normalizarCategoria, 
      combinarTransaccionesConRecurrentes, 
      calcularCicloTarjeta, 
      prepararTransaccion, 
      calcularConsolidadoFinanciero, 
      dividirEnCuotas, 
      sumarMesesAFecha 
    } = window.FinancialEngine;

    const tarjetasConfig = [
      { id: 'TC_BCP', nombre: 'BCP Visa Signature', diaCorte: 20, diaVencimiento: 10, limiteCredito: 10000, colorHex: '#0033a0' },
      { id: 'TC_BBVA', nombre: 'BBVA Mastercard Black', diaCorte: 5, diaVencimiento: 25, limiteCredito: 8000, colorHex: '#004481' }
    ];

    // Prueba 1: Ciclos
    const c1 = calcularCicloTarjeta('2026-09-15', 20, 10);
    report('Ciclo antes de corte (15 <= 20)', c1.fechaCorte === '2026-09-20' && c1.fechaVencimiento === '2026-10-10', `Corte: ${c1.fechaCorte}, Vencimiento: ${c1.fechaVencimiento}`);

    const c2 = calcularCicloTarjeta('2026-09-22', 20, 10);
    report('Ciclo después de corte (22 > 20)', c2.fechaCorte === '2026-10-20' && c2.fechaVencimiento === '2026-11-10', `Corte pasa a ${c2.fechaCorte}, Vencimiento a ${c2.fechaVencimiento}`);

    // Prueba 2: Caso Base del Usuario
    const txsBase = [
      prepararTransaccion({ id: '1', fecha: '2026-09-01', tipo: TIPOS_TRANSACCION.INGRESO, monto: 2000, categoria: 'Sueldo' }, tarjetasConfig),
      prepararTransaccion({ id: '2', fecha: '2026-09-02', tipo: TIPOS_TRANSACCION.GASTO_DIRECTO, monto: 100, categoria: 'Efectivo' }, tarjetasConfig),
      prepararTransaccion({ id: '3', fecha: '2026-09-05', tipo: TIPOS_TRANSACCION.PAGO_TC_VENCIDA, monto: 500, tarjetaAfectada: 'TC_BCP' }, tarjetasConfig)
    ];
    const resBase = calcularConsolidadoFinanciero(txsBase, tarjetasConfig, '2026-09');
    const okBase = resBase.flujoEfectivo.balanceLibreNeto === 1400;
    report('Caso Base: Ingreso 2000 - Gasto 100 - TC Vencida 500', okBase, `Balance Libre: S/ ${resBase.flujoEfectivo.balanceLibreNeto} (Esperado: S/ 1400.00)`);

    // Prueba 3: Caso con Prepago del Usuario
    const txsPrepago = [
      ...txsBase,
      prepararTransaccion({ id: '4', fecha: '2026-09-10', tipo: TIPOS_TRANSACCION.CONSUMO_TC, tarjetaAfectada: 'TC_BCP', monto: 600 }, tarjetasConfig),
      prepararTransaccion({ id: '5', fecha: '2026-09-15', tipo: TIPOS_TRANSACCION.PREPAGO_TC, tarjetaAfectada: 'TC_BCP', monto: 100 }, tarjetasConfig)
    ];
    const resPrepago = calcularConsolidadoFinanciero(txsPrepago, tarjetasConfig, '2026-09');
    const okMesActual = resPrepago.flujoEfectivo.balanceLibreNeto === 1300 && resPrepago.flujoEfectivo.prepagosRealizados === 100;
    report('Caso con Prepago: Salida de Flujo en Mes Actual (2000 - 700)', okMesActual, `Balance Libre Mes Actual: S/ ${resPrepago.flujoEfectivo.balanceLibreNeto} (Esperado: S/ 1300.00)`);

    const okMesSiguiente = resPrepago.tarjetasCredito.deudaTotalProyectada === 500;
    report('Caso con Prepago: Deuda Proyectada Mes Siguiente (600 - 100)', okMesSiguiente, `Deuda TC Mes Siguiente: S/ ${resPrepago.tarjetasCredito.deudaTotalProyectada} (Esperado: S/ 500.00)`);

    // Prueba 4: Umbral de Gasto Progresivo (50% y +10% en cada aumento)
    const { generarAlertasFinancieras } = window.FinancialEngine;
    
    // Sub-caso: Gasto 35% (< 50%) -> Sin alerta
    const alertas35 = generarAlertasFinancieras(resPrepago, '2026-09-06');
    const sinAlertaSub50 = !alertas35.some(a => a.id.startsWith('alerta-gasto-'));
    report('Regla 1: Gasto al 35% (<50%) NO genera alerta de umbral', sinAlertaSub50, 'Sin falsos positivos por debajo del 50%');

    // Sub-caso: Gasto 55% (>= 50%) -> Alerta escalón 50%
    const txsGasto55 = [
      ...txsPrepago,
      prepararTransaccion({ id: '6', fecha: '2026-09-18', tipo: TIPOS_TRANSACCION.GASTO_DIRECTO, monto: 400, categoria: 'Compras' }, tarjetasConfig)
    ];
    const resGasto55 = calcularConsolidadoFinanciero(txsGasto55, tarjetasConfig, '2026-09');
    const alertas55 = generarAlertasFinancieras(resGasto55, '2026-09-18');
    const ok50 = alertas55.some(a => a.id === 'alerta-gasto-50');
    report('Regla 1: Gasto al 55% dispara alerta al superar el 50%', ok50, 'Alerta 50% activada correctamente');

    // Sub-caso: Gasto 65% (>= 60%) -> Alerta escalón 60% (+10% adicional)
    const txsGasto65 = [
      ...txsGasto55,
      prepararTransaccion({ id: '7', fecha: '2026-09-20', tipo: TIPOS_TRANSACCION.GASTO_DIRECTO, monto: 200, categoria: 'Servicios' }, tarjetasConfig)
    ];
    const resGasto65 = calcularConsolidadoFinanciero(txsGasto65, tarjetasConfig, '2026-09');
    const alertas65 = generarAlertasFinancieras(resGasto65, '2026-09-20');
    const ok60 = alertas65.some(a => a.id === 'alerta-gasto-60');
    report('Regla 1: Gasto al 65% dispara alerta al superar el 60% (+10%)', ok60, 'Alerta 60% activada correctamente');

    // Prueba 5: Alerta de Vencimiento de Tarjeta cuando faltan <= 5 días
    // resPrepago proyecta la deuda de TC_BCP para octubre con vencimiento el 2026-10-10 (deuda: S/ 500)
    const alertasVenc = generarAlertasFinancieras(resPrepago, '2026-10-06'); // 4 días antes del 2026-10-10
    const okVenc = alertasVenc.some(a => a.id === 'venc-TC_BCP');
    report('Regla 2: Alerta cuando faltan <= 5 días para vencimiento de tarjeta', okVenc, 'Alerta de vencimiento en 4 días generada con éxito');

    // Prueba 6: CASO REPORTADO POR EL USUARIO (Google Sheets Date string + Tarjeta IO BCP / TC_IO)
    const tarjetasUsuario = [
      { id: 'TC_IO', nombre: 'IO BCP', diaCorte: 20, diaVencimiento: 10, limiteCredito: 5000, colorHex: '#0ea5e9' }
    ];
    const txsUsuarioSheets = [
      {
        id: 'TX-1',
        fecha: '2026-09-06',
        tipo: TIPOS_TRANSACCION.CONSUMO_TC,
        tarjetaAfectada: 'TC_IO',
        categoria: 'Supermercado',
        monto: 93.08,
        // String largo tal como lo serializaba Google Sheets:
        mesImpactoTC: 'Thu Oct 01 2026 00:00:00 GMT-0500 (hora estándar de Perú)'
      },
      {
        id: 'TX-2',
        fecha: '2026-09-06',
        tipo: TIPOS_TRANSACCION.CONSUMO_TC,
        tarjetaAfectada: 'TC_IO',
        categoria: 'Suscripciones',
        monto: 18.99,
        mesImpactoTC: 'Thu Oct 01 2026 00:00:00 GMT-0500 (hora estándar de Perú)'
      }
    ];
    const resUsuario = calcularConsolidadoFinanciero(txsUsuarioSheets, tarjetasUsuario, '2026-09');
    const cardRes = resUsuario.tarjetasCredito.desgloseTarjetas[0];
    const totalEsperado = 112.07; // 93.08 + 18.99
    const okSumaTC = cardRes && Math.abs(cardRes.consumosCiclo - totalEsperado) < 0.001;
    const okCategorias = (resUsuario.categorias.gastos['Supermercado'] === 93.08) &&
                         (resUsuario.categorias.gastos['Suscripciones'] === 18.99);

    report('Caso Real Usuario: Suma consumos TC (93.08 + 18.99 = S/ 112.07) con fecha Date de Sheets', okSumaTC, `Consumo TC IO BCP: S/ ${cardRes ? cardRes.consumosCiclo : 0} (Esperado: S/ 112.07)`);
    report('Caso Real Usuario: Categorías para gráficos (Supermercado S/ 93.08, Suscripciones S/ 18.99)', okCategorias, `Supermercado: S/ ${resUsuario.categorias.gastos['Supermercado']}, Suscripciones: S/ ${resUsuario.categorias.gastos['Suscripciones']}`);

    // Prueba 7: PRESUPUESTOS - Alerta al alcanzar el 90%
    const presupuestosTest = [
      { categoria: 'Supermercado', monto: 500, moneda: 'PEN' },
      { categoria: 'Restaurantes', monto: 200, moneda: 'PEN' }
    ];
    const txsPresupuesto = [
      { id: 'P1', fecha: '2026-09-02', tipo: TIPOS_TRANSACCION.GASTO_DIRECTO, categoria: 'Supermercado', monto: 460, mesImpactoEfectivo: '2026-09' }, // 92% (>= 90%)
      { id: 'P2', fecha: '2026-09-03', tipo: TIPOS_TRANSACCION.GASTO_DIRECTO, categoria: 'Restaurantes', monto: 230, mesImpactoEfectivo: '2026-09' }  // 115% (>= 100%)
    ];
    const resPresupuesto = calcularConsolidadoFinanciero(txsPresupuesto, [], '2026-09', presupuestosTest);
    const alertasPresupuesto = generarAlertasFinancieras(resPresupuesto, '2026-09-05');

    const okAlerta90 = alertasPresupuesto.some(a => a.id === 'alerta-presupuesto-90-Supermercado');
    report('Regla Presupuestos: Alerta al alcanzar >= 90% (Supermercado S/ 460 de S/ 500 = 92%)', okAlerta90, 'Alerta predictiva del 90% generada');

    // Prueba 8: PRESUPUESTOS - Alerta al superar el 100% (Excedido)
    const okAlerta100 = alertasPresupuesto.some(a => a.id === 'alerta-presupuesto-exceso-Restaurantes');
    report('Regla Presupuestos: Alerta crítica al exceder 100% (Restaurantes S/ 230 de S/ 200 = 115%)', okAlerta100, 'Alerta crítica de sobregiro generada');

    // Prueba 9: HISTORIAL DE AHORRO MENSUAL (MESES CERRADOS)
    const txsHistoricas = [
      // Mes cerrado: 2026-08 (Ingreso 3000, Gasto 1200 -> Ahorro 1800, Tasa 60%)
      { id: 'H1', fecha: '2026-08-01', tipo: TIPOS_TRANSACCION.INGRESO, monto: 3000, mesImpactoEfectivo: '2026-08' },
      { id: 'H2', fecha: '2026-08-15', tipo: TIPOS_TRANSACCION.GASTO_DIRECTO, monto: 1200, mesImpactoEfectivo: '2026-08' },
      // Mes en curso: 2026-09 (Ingreso 2000, Gasto 500 -> Ahorro 1500)
      { id: 'H3', fecha: '2026-09-01', tipo: TIPOS_TRANSACCION.INGRESO, monto: 2000, mesImpactoEfectivo: '2026-09' },
      { id: 'H4', fecha: '2026-09-02', tipo: TIPOS_TRANSACCION.GASTO_DIRECTO, monto: 500, mesImpactoEfectivo: '2026-09' }
    ];
    const resHistorico = calcularConsolidadoFinanciero(txsHistoricas, [], '2026-09', []);
    const mesAgosto = resHistorico.historicoAhorro.mesesCerrados.find(m => m.mes === '2026-08');
    const okHistoricoAgosto = mesAgosto && mesAgosto.ahorroNeto === 1800 && mesAgosto.tasaAhorro === 60 && mesAgosto.esCerrado;

    report('Historial de Ahorro: Cierre mensual exacto (Agosto: Ingresos 3000 - Salidas 1200 = Ahorro S/ 1800, 60%)', okHistoricoAgosto, `Ahorro neto calculado: S/ ${mesAgosto ? mesAgosto.ahorroNeto : 0}, Tasa: ${mesAgosto ? mesAgosto.tasaAhorro : 0}%`);

    // Prueba 10: CUOTAS SIN INTERESES - División y fechas de corte
    const txCompraCuotas = {
      id: 'TX-LAPTOP',
      fecha: '2026-09-06',
      tipo: TIPOS_TRANSACCION.CONSUMO_TC,
      tarjetaAfectada: 'TC_BCP', // diaCorte: 20, diaVencimiento: 10
      categoria: 'Tecnología',
      monto: 1000,
      cuotas: 3,
      notas: 'Laptop de trabajo'
    };
    const listaCuotas = dividirEnCuotas(txCompraCuotas, tarjetasConfig);
    const okCantidadCuotas = listaCuotas.length === 3;
    const sumaCuotas = listaCuotas.reduce((acc, c) => acc + c.monto, 0);
    const okSumaCuotas = Math.abs(sumaCuotas - 1000) < 0.001;
    const cuota1 = listaCuotas[0];
    const cuota2 = listaCuotas[1];
    const cuota3 = listaCuotas[2];
    const okMontosCuotas = (cuota1.monto === 333.34) && (cuota2.monto === 333.33) && (cuota3.monto === 333.33);
    const okCiclosCuotas = (cuota1.mesImpactoTC === '2026-10') && (cuota2.mesImpactoTC === '2026-11') && (cuota3.mesImpactoTC === '2026-12');

    report('Cuotas Sin Intereses: División exacta y ajuste de céntimos (333.34 + 333.33 + 333.33 = S/ 1,000.00)', 
      okCantidadCuotas && okSumaCuotas && okMontosCuotas && okCiclosCuotas,
      `Cuota 1: S/ ${cuota1.monto} (${cuota1.mesImpactoTC}), Cuota 2: S/ ${cuota2.monto} (${cuota2.mesImpactoTC}), Cuota 3: S/ ${cuota3.monto} (${cuota3.mesImpactoTC})`
    );

    // Prueba 11: CUOTAS SIN INTERESES - Impacto en Deuda Proyectada del mes siguiente
    // En septiembre 2026, la deuda proyectada para octubre (mes siguiente) debe ser ÚNICAMENTE la Cuota 1 (S/ 333.34)
    const resCuotas = calcularConsolidadoFinanciero(listaCuotas, tarjetasConfig, '2026-09', []);
    const bcpDeudaProyectada = resCuotas.tarjetasCredito.desgloseTarjetas.find(c => c.id === 'TC_BCP');
    const okDeudaCuota1 = bcpDeudaProyectada && Math.abs(bcpDeudaProyectada.consumosCiclo - 333.34) < 0.01;

    report('Cuotas Sin Intereses: Proyección de deuda mensual exacta (Octubre recibe S/ 333.34 en vez de S/ 1,000)',
      okDeudaCuota1,
      `Deuda TC BCP proyectada: S/ ${bcpDeudaProyectada ? bcpDeudaProyectada.consumosCiclo : 0} (Esperado: S/ 333.34)`
    );

    // Prueba 12: MOVIMIENTOS FIJOS RECURRENTES - Cálculo de balance base proyectado
    const fijosTest = [
      { id: 'R1', nombre: 'Sueldo', tipo: 'Ingreso_Fijo', monto: 3500, activo: true },
      { id: 'R2', nombre: 'Alquiler', tipo: 'Gasto_Fijo', monto: 1200, activo: true },
      { id: 'R3', nombre: 'Servicios', tipo: 'Gasto_Fijo', monto: 180, activo: true },
      { id: 'R4', nombre: 'Gimnasio Inactivo', tipo: 'Gasto_Fijo', monto: 150, activo: false }
    ];
    const ingFijosActivos = fijosTest.filter(r => r.activo && r.tipo === 'Ingreso_Fijo').reduce((acc, r) => acc + r.monto, 0);
    const gasFijosActivos = fijosTest.filter(r => r.activo && r.tipo === 'Gasto_Fijo').reduce((acc, r) => acc + r.monto, 0);
    const balanceFijoBase = ingFijosActivos - gasFijosActivos;
    const okFijos = (ingFijosActivos === 3500) && (gasFijosActivos === 1380) && (balanceFijoBase === 2120);

    report('Movimientos Fijos: Balance base mensual (Ingresos S/ 3500 - Gastos S/ 1380 = Balance Base S/ 2120)',
      okFijos,
      `Ingresos Fijos: S/ ${ingFijosActivos}, Gastos Fijos: S/ ${gasFijosActivos}, Balance Base: S/ ${balanceFijoBase}`
    );

    // Prueba 13: CATÁLOGO MAESTRO UNIFICADO DE CATEGORÍAS
    const okCatsGastoLen = CATEGORIAS_GASTO.length === 13;
    const okCatsIngresoLen = CATEGORIAS_INGRESO.length === 4;
    const okNormVivienda = normalizarCategoria('Vivienda') === 'Hogar';
    const okNormOcio = normalizarCategoria('Ocio') === 'Entretenimiento';
    const okNormFreelance = normalizarCategoria('Freelance', 'Ingreso') === 'Freelance / Negocio';
    const okNormDirecta = normalizarCategoria('Servicios') === 'Servicios';
    const okPrueba13 = okCatsGastoLen && okCatsIngresoLen && okNormVivienda && okNormOcio && okNormFreelance && okNormDirecta;

    report('Catálogo Maestro Unificado: 13 categorías de gasto, 4 de ingreso y normalización legacy retrocompatible',
      okPrueba13,
      `Categorías Gasto: ${CATEGORIAS_GASTO.length} (esperado 13), Ingreso: ${CATEGORIAS_INGRESO.length} (esperado 4), Normalización: Vivienda->${normalizarCategoria('Vivienda')}, Ocio->${normalizarCategoria('Ocio')}`
    );

    // Prueba 14: INTEGRACIÓN DE FIJOS EN FLUJO DISPONIBLE DEL MES
    // Sin transacciones variables aún, el mes debe reflejar los fijos activos (no S/ 0.00)
    const recurrentesPrueba14 = [
      { id: 'REC-SUELDO', nombre: 'Sueldo Principal', tipo: 'Ingreso_Fijo', monto: 4000, categoria: 'Sueldo', diaMes: 28, activo: true },
      { id: 'REC-ALQUILER', nombre: 'Alquiler Depto', tipo: 'Gasto_Fijo', monto: 1500, categoria: 'Hogar', diaMes: 5, activo: true },
      { id: 'REC-GYM', nombre: 'Gym Suspendido', tipo: 'Gasto_Fijo', monto: 100, categoria: 'Salud', diaMes: 1, activo: false }
    ];
    const consolidadoFijos = calcularConsolidadoFinanciero([], tarjetasConfig, '2026-09', [], recurrentesPrueba14);
    const okIngresoFlujo = consolidadoFijos.flujoEfectivo.ingresos === 4000 && consolidadoFijos.flujoEfectivo.ingresosFijos === 4000;
    const okGastoFlujo = consolidadoFijos.flujoEfectivo.gastosDirectos === 1500 && consolidadoFijos.flujoEfectivo.gastosFijos === 1500;
    const okBalanceLibre = consolidadoFijos.flujoEfectivo.balanceLibreNeto === 2500;
    const okPrueba14 = okIngresoFlujo && okGastoFlujo && okBalanceLibre;

    report('Flujo Disponible Inicial: Fijos activos alimentan automáticamente el mes (Ingresos S/ 4,000 - Gastos S/ 1,500 = Balance Libre S/ 2,500)',
      okPrueba14,
      `Ingresos Flujo: S/ ${consolidadoFijos.flujoEfectivo.ingresos} (Fijos: ${consolidadoFijos.flujoEfectivo.ingresosFijos}), Gastos: S/ ${consolidadoFijos.flujoEfectivo.gastosDirectos}, Balance Libre: S/ ${consolidadoFijos.flujoEfectivo.balanceLibreNeto}`
    );

    // Prueba 15: SUMA DE FIJOS + VARIABLES EN CATEGORÍAS Y PRESUPUESTOS
    // Fijo de Servicios S/ 100 + Gasto diario variable de Servicios S/ 50 = S/ 150 en categoría Servicios
    const txsVariablesPrueba15 = [
      { id: 'TX-VAR-1', fecha: '2026-09-02', tipo: TIPOS_TRANSACCION.GASTO_DIRECTO, monto: 50, categoria: 'Servicios', mesImpactoEfectivo: '2026-09' }
    ];
    const recurrentesPrueba15 = [
      { id: 'REC-SERV', nombre: 'Luz y Agua', tipo: 'Gasto_Fijo', monto: 100, categoria: 'Servicios', diaMes: 15, activo: true }
    ];
    const presupuestosPrueba15 = [
      { categoria: 'Servicios', limite: 200 }
    ];
    const consolidadoSuma = calcularConsolidadoFinanciero(txsVariablesPrueba15, tarjetasConfig, '2026-09', presupuestosPrueba15, recurrentesPrueba15);
    const gastoServiciosTotal = consolidadoSuma.categorias.gastos['Servicios'] || 0;
    const presupuestoServicios = consolidadoSuma.presupuestos.find(p => p.categoria === 'Servicios');
    const okSumaCategorias = gastoServiciosTotal === 150;
    const okPresupuesto = presupuestoServicios && presupuestoServicios.gastado === 150 && presupuestoServicios.porcentaje === 75;
    const okPrueba15 = okSumaCategorias && okPresupuesto;

    report('Consolidación Fijos + Variables: Gastos fijos y diarios se unifican en la misma categoría presupuestaria (S/ 100 fijo + S/ 50 diario = S/ 150 en Servicios, 75%)',
      okPrueba15,
      `Total en Servicios: S/ ${gastoServiciosTotal}, Gastado Presupuesto: S/ ${presupuestoServicios ? presupuestoServicios.gastado : 0}, Porcentaje: ${presupuestoServicios ? presupuestoServicios.porcentaje : 0}%`
    );

    // Prueba 16: RECURRENTE EN TARJETA DE CRÉDITO + PREPAGO DESDE SUELDO
    // Internet S/ 120 recurrente en TC_BCP + Prepago S/ 120 desde sueldo:
    // La categoría Servicios se mantiene en S/ 120 (NO se duplica a 240) y la deuda neta de TC_BCP queda amortizada a 0.
    const recurrentesPrueba16 = [
      { id: 'REC-NET', nombre: 'Internet Fibra', tipo: 'Gasto_Fijo', monto: 120, categoria: 'Servicios', diaMes: 10, metodoPago: 'TC_BCP', activo: true }
    ];
    // Transacción de prepago realizada desde efectivo/sueldo hacia TC_BCP
    const txPrepago16 = prepararTransaccion({
      id: 'TX-PREP-NET',
      fecha: '2026-09-12',
      tipo: TIPOS_TRANSACCION.PREPAGO_TC,
      tarjetaAfectada: 'TC_BCP',
      monto: 120,
      categoria: 'Amortización Capital',
      metodoPago: 'Efectivo',
      notas: 'Abono sueldo a TC por Internet'
    }, tarjetasConfig);

    const consolidadoTCPrepay = calcularConsolidadoFinanciero([txPrepago16], tarjetasConfig, '2026-09', [], recurrentesPrueba16);
    const servCatMonto = consolidadoTCPrepay.categorias.gastos['Servicios'] || 0;
    const bcpCardEstado = consolidadoTCPrepay.tarjetasCredito.desgloseTarjetas.find(c => c.id === 'TC_BCP');
    const okServicioNoDuplicado = servCatMonto === 120;
    const okDeudaNetaCero = bcpCardEstado && bcpCardEstado.deudaNetaProyectada === 0 && bcpCardEstado.porcentajeAmortizado === 100;
    const okFlujoPrepagado = consolidadoTCPrepay.flujoEfectivo.prepagosRealizados === 120;
    const okPrueba16 = okServicioNoDuplicado && okDeudaNetaCero && okFlujoPrepagado;

    report('Recurrente en TC + Prepago desde Sueldo: Servicios se mantiene en S/ 120 exactos sin duplicidad y la deuda de la tarjeta queda amortizada a S/ 0',
      okPrueba16,
      `Gasto en Servicios: S/ ${servCatMonto}, Consumo TC: S/ ${bcpCardEstado ? bcpCardEstado.consumosCiclo : 0}, Prepagado: S/ ${bcpCardEstado ? bcpCardEstado.prepagosCiclo : 0}, Deuda Neta TC: S/ ${bcpCardEstado ? bcpCardEstado.deudaNetaProyectada : 0}`
    );

    // Prueba 17: CONFIRMACIÓN / AJUSTE MENSUAL DE RECIBO VARIABLE
    // Gas Natural presupuestado en S/ 100 base mensual.
    // Para Septiembre 2026 llega el recibo real por S/ 80 y se confirma asentando la transacción.
    // En Septiembre: toma S/ 80 real.
    // En Octubre (o meses sin confirmar): sigue proyectando S/ 100 base intactos.
    const recurrenteGas = { id: 'REC-GAS', nombre: 'Gas Natural', tipo: 'Gasto_Fijo', monto: 100, categoria: 'Servicios', diaMes: 18, activo: true };
    const txGasSeptiembre = {
      id: 'TX-CONF-GAS-09',
      recurrenteId: 'REC-GAS',
      fecha: '2026-09-18',
      tipo: TIPOS_TRANSACCION.GASTO_DIRECTO,
      monto: 80,
      categoria: 'Servicios',
      metodoPago: 'Efectivo',
      mesImpactoEfectivo: '2026-09',
      notas: '[Fijo: REC-GAS] Gas Natural'
    };

    // Mes Septiembre con confirmación de recibo menor (S/ 80)
    const combSept = combinarTransaccionesConRecurrentes([txGasSeptiembre], [recurrenteGas], '2026-09', tarjetasConfig);
    const gasSeptEstado = combSept.recurrentesEstadoMes.find(r => r.id === 'REC-GAS');
    const consolidadoSept = calcularConsolidadoFinanciero([txGasSeptiembre], tarjetasConfig, '2026-09', [], [recurrenteGas]);
    const totalServSept = consolidadoSept.categorias.gastos['Servicios'] || 0;

    // Mes Octubre (sin transacción confirmada todavía)
    const combOct = combinarTransaccionesConRecurrentes([txGasSeptiembre], [recurrenteGas], '2026-10', tarjetasConfig);
    const gasOctEstado = combOct.recurrentesEstadoMes.find(r => r.id === 'REC-GAS');
    const consolidadoOct = calcularConsolidadoFinanciero([txGasSeptiembre], tarjetasConfig, '2026-10', [], [recurrenteGas]);
    const totalServOct = consolidadoOct.categorias.gastos['Servicios'] || 0;

    const okSeptReal = gasSeptEstado && gasSeptEstado.estadoMes === 'confirmado' && gasSeptEstado.montoMes === 80 && totalServSept === 80;
    const okOctProyectado = gasOctEstado && gasOctEstado.estadoMes === 'proyectado' && gasOctEstado.montoMes === 100 && totalServOct === 100;
    const okPrueba17 = okSeptReal && okOctProyectado;

    report('Confirmación Mensual de Recibos: Septiembre toma S/ 80 real sin duplicidad, mientras Octubre preserva intactos sus S/ 100 presupuestados',
      okPrueba17,
      `Septiembre (Confirmado): S/ ${totalServSept} (estado: ${gasSeptEstado ? gasSeptEstado.estadoMes : ''}), Octubre (Proyectado): S/ ${totalServOct} (estado: ${gasOctEstado ? gasOctEstado.estadoMes : ''})`
    );

    summaryBox.innerHTML = `
      <div class="flex items-center justify-between">
        <span class="font-bold ${failedCount === 0 ? 'text-emerald-400' : 'text-rose-400'} text-base">
          ${failedCount === 0 ? '🎉 TODAS LAS PRUEBAS PASARON EXITOSAMENTE' : '⚠️ ALGUNAS PRUEBAS FALLARON'}
        </span>
        <span class="text-xs text-slate-400">${passedCount} pasadas, ${failedCount} falladas</span>
      </div>
    `;
  </script>
